<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de administración · L'Amore</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-root="../">
  <div id="site-header"></div>

  <!-- Oculto hasta que admin.js confirma que hay sesión de superadmin -->
  <main class="dash" hidden>
    <div class="container">
      <div class="dash__head">
        <p class="section__eyebrow">Superadmin</p>
        <h1>Panel de administración</h1>
        <p id="admin-hello"></p>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat__label">Parejas registradas</div><div class="stat__value" id="stat-couples">0</div></div>
        <div class="stat"><div class="stat__label">Bodas en 90 días</div><div class="stat__value" id="stat-upcoming">0</div></div>
        <div class="stat"><div class="stat__label">Altas en 30 días</div><div class="stat__value" id="stat-new">0</div></div>
        <div class="stat"><div class="stat__label">Superadmins</div><div class="stat__value" id="stat-admins">0</div></div>
      </div>

      <section class="panel">
        <h2>Usuarios</h2>
        <div class="form__message" id="admin-message" role="status"></div>

        <div class="toolbar">
          <div class="field">
            <label for="search">Buscar</label>
            <input type="search" id="search" placeholder="Nombre o correo">
          </div>
          <div class="field field--narrow">
            <label for="role-filter">Rol</label>
            <select id="role-filter">
              <option value="">Todos</option>
              <option value="pareja">Parejas</option>
              <option value="superadmin">Superadmins</option>
            </select>
          </div>
        </div>

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Fecha de boda</th>
                <th>Alta</th>
                <th>Rol</th>
                <th><span class="visually-hidden">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
        <p class="empty" id="users-empty" hidden>No hay usuarios que coincidan.</p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
