<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vuestro panel · L'Amore</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-root="./">
  <div id="site-header"></div>

  <!-- Oculto hasta que panel.js confirma que hay sesión de pareja -->
  <main class="dash" hidden>
    <div class="container">
      <div class="dash__head">
        <p class="section__eyebrow">Vuestro panel</p>
        <h1 id="couple-names"></h1>
        <p id="countdown"></p>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat__label">Fecha</div><div class="stat__value stat__value--sm" id="stat-date">—</div></div>
        <div class="stat"><div class="stat__label">Lugar</div><div class="stat__value stat__value--sm" id="stat-venue">—</div></div>
        <div class="stat"><div class="stat__label">Invitados previstos</div><div class="stat__value" id="stat-guests">—</div></div>
        <div class="stat"><div class="stat__label">Presupuesto</div><div class="stat__value" id="stat-budget">—</div></div>
      </div>

      <div class="dash__grid">
        <section class="panel">
          <h2>Datos de la boda</h2>
          <form class="form" id="wedding-form" novalidate>
            <div class="form__message" role="status"></div>

            <div class="form__row">
              <div class="field">
                <label for="name">Tu nombre</label>
                <input type="text" id="name" name="name" required>
                <span class="field__error"></span>
              </div>
              <div class="field">
                <label for="partner">Nombre de tu pareja</label>
                <input type="text" id="partner" name="partner" required>
                <span class="field__error"></span>
              </div>
            </div>

            <div class="form__row">
              <div class="field">
                <label for="weddingDate">Fecha de la boda</label>
                <input type="date" id="weddingDate" name="weddingDate">
                <span class="field__error"></span>
              </div>
              <div class="field">
                <label for="venue">Lugar</label>
                <input type="text" id="venue" name="venue" placeholder="Finca, ciudad…">
                <span class="field__error"></span>
              </div>
            </div>

            <div class="form__row">
              <div class="field">
                <label for="guests">Invitados previstos</label>
                <input type="number" id="guests" name="guests" min="0" step="1" inputmode="numeric">
                <span class="field__error"></span>
              </div>
              <div class="field">
                <label for="budget">Presupuesto (€)</label>
                <input type="number" id="budget" name="budget" min="0" step="100" inputmode="numeric">
                <span class="field__error"></span>
              </div>
            </div>

            <div><button class="btn" type="submit">Guardar cambios</button></div>
          </form>
        </section>

        <aside class="panel">
          <h2>Herramientas</h2>
          <ul class="panel__links">
            <li><a href="index.html#mesas">Plan de mesas</a></li>
          </ul>
          <p class="panel__note">Pronto: lista de invitados, proveedores y presupuesto detallado.</p>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/panel.js"></script>
</body>
</html>
